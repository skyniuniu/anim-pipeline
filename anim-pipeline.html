<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动画管线管理工具</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--subtext:#8b949e;--gray:#6e7681;--yellow:#d29922;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--accent:#f0883e;--cyan:#39d2c0;--purple:#a855f7;--input-bg:#21262d;--table-head:#1c2128;--row-border:#21262d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px;max-width:1600px;margin:0 auto}
input,select,button{font-family:inherit}
.container{max-width:100%;margin:0 auto}
.app-title{font-size:22px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.app-title .line{flex:1;height:1px;background:var(--border)}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0 0 12px 0;color:var(--subtext)}
.section-title .line{flex:1;height:1px;background:var(--border)}
.stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:120px;flex:1}
.stat-label{font-size:11px;color:var(--subtext)}
.stat-val{font-size:22px;font-weight:800;margin-top:2px}
.stat-sub{font-size:10px;color:var(--gray);margin-top:2px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--subtext);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.filter-btn:hover{border-color:var(--blue);color:var(--text)}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search-box{width:260px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;margin-bottom:16px;transition:border-color .15s}
.search-box:focus{border-color:var(--blue)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12px}
.lgd-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-bottom:28px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.mc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mc-name{font-size:16px;font-weight:800;flex:1;cursor:pointer;transition:color .15s}
.mc-name:hover{color:var(--cyan)}
.follower-name{cursor:pointer;border-bottom:1px dashed transparent;transition:all .15s}
.follower-name:hover{border-bottom-color:var(--cyan);color:var(--cyan)}
.deadline-text:hover,.mc-info [ondblclick]:hover,.tbl-gun:hover,.tbl-cell:hover{border-bottom-color:var(--cyan)!important;color:var(--cyan)!important}
.mc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid}
.btn-del{background:none;border:none;color:var(--gray);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;transition:all .15s}
.btn-del:hover{background:var(--red);color:#fff}
.mc-prog{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mc-prog-bar{flex:1;height:8px;background:var(--input-bg);border-radius:4px;overflow:hidden}
.mc-prog-fill{height:100%;border-radius:4px;transition:width .3s}
.mc-prog-txt{font-size:12px;font-weight:700;min-width:36px;text-align:right}
.mc-info{display:flex;gap:16px;margin-bottom:8px;font-size:12px;color:var(--subtext);flex-wrap:wrap}
.mc-milestone{font-size:11px;color:var(--gray);margin-bottom:8px}
.anim-stage{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.anim-stage-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.anim-stage-name{flex:1;color:var(--subtext);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anim-stage-pct{font-weight:700;font-size:11px;min-width:36px;text-align:right}
.anim-input{width:56px;padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:12px;outline:none;text-align:center}
.anim-input:focus{border-color:var(--blue)}
.ed-s{padding:3px 6px;border-radius:6px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:12px;outline:none}
.ed-i{background:var(--input-bg);border:1px solid var(--border);color:var(--text);outline:none;font-family:inherit}
.ed-i:focus{border-color:var(--blue)}
.btn-add{padding:6px 14px;border-radius:8px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:11px;font-weight:600;transition:opacity .15s}
.btn-add:hover{opacity:.85}
.btn-ghost{padding:5px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--subtext);cursor:pointer;font-size:12px;transition:all .15s}
.btn-ghost:hover{border-color:var(--blue);color:var(--text)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;min-width:320px;max-width:500px}
.modal-box input,.modal-box select{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;margin-bottom:10px}
.modal-box input:focus,.modal-box select:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-actions button{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.modal-actions .btn-pri{background:var(--blue);color:#fff}
.modal-actions .btn-sec{background:var(--input-bg);color:var(--subtext);border:1px solid var(--border)}
/* timeline for subtasks */
.tsk-list{margin-top:8px;border-left:2px solid var(--border);padding-left:12px}
.tsk-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--subtext)}
.tsk-item.done{color:var(--green);text-decoration:line-through;opacity:.6}
.tsk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-anim"><div class="modal-box">

<select id="man-tier"><option value="t1">T1 主力</option><option value="iter">迭代</option><option value="ops">运营</option><option value="new">新增</option><option value="tune">调优优化</option></select>
<input id="man-days" type="number" value="10" min="0" step="0.5" placeholder="预估人天">
<input id="man-follower" placeholder="跟进人（如 张三/李四）">
<input id="man-planner" placeholder="策划（如 雷可蔚）">
<input id="man-milestone" placeholder="里程碑目标">
<input id="man-deadline" type="date" placeholder="截止日期">
<div class="modal-actions"><button class="btn-sec" onclick="closeModal('modal-anim')">取消</button><button class="btn-pri" onclick="addAnimTask()">确认新增</button></div>
</div></div>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function saveAll(){try{localStorage.setItem('ap_anim',JSON.stringify(animTasks));localStorage.setItem('ap_anim_bak',JSON.stringify(animTasks))}catch(e){}}
function loadAll(){try{var a=localStorage.getItem('ap_anim');if(a){animTasks=JSON.parse(a);animTasks.forEach(function(t){if((t.tier==='t1'||t.tier==='iter')&&typeof t.L1!=='number'){t.L1=0;t.L2=0;t.L3=0}});return}}catch(e){}try{var a=localStorage.getItem('ap_anim_bak');if(a){animTasks=JSON.parse(a);animTasks.forEach(function(t){if((t.tier==='t1'||t.tier==='iter')&&typeof t.L1!=='number'){t.L1=0;t.L2=0;t.L3=0}});saveAll();toast('已从备份恢复数据');return}}catch(e){}saveAll()}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},2000)}
function openModal(id){document.getElementById(id).className='modal-overlay show'}
function closeModal(id){document.getElementById(id).className='modal-overlay'}

function calcAP(a){if(a.dynamicDone)return 100;if(a.tier==='t1'||a.tier==='iter'){var l1=typeof a.L1==='number'?a.L1:0,l2=typeof a.L2==='number'?a.L2:0,l3=typeof a.L3==='number'?a.L3:0;return Math.round(Math.min(l1*0.1+l2*0.2+l3*0.7,100))}if(a.gacScore>=80)return Math.round(80+Math.min((a.gacScore-80)/(95-80)*15,15));return Math.min(a.gacScore||0,100)}

function animStage(a){if(a.dynamicDone)return '动态完成';var p=calcAP(a);if(p>=80)return 'GAC冲分';return '制作中'}
function animSC(s){return s==='制作中'?'var(--yellow)':s==='GAC冲分'?'var(--accent)':'var(--green)'}
function statCard(c,l,v,s){return '<div class="stat-card"><div class="stat-label" style="color:'+c+'">'+l+'</div><div class="stat-val" style="color:'+c+'">'+v+'</div>'+(s?'<div class="stat-sub">'+s+'</div>':'')+'</div>'}
function lgd(c,t){return '<span><span class="lgd-dot" style="background:'+c+'"></span>'+t+'</span>'}

function renderStats(){var tE=0,fC=0,dC=0;animTasks.forEach(function(a){tE+=a.estDays||0;var p=calcAP(a);if(p>=95)dC++;else if(p>0)fC++});var avgP=animTasks.length>0?Math.round(animTasks.reduce(function(s,a){return s+calcAP(a)},0)/animTasks.length):0;return '<div class="stats-row">'+statCard('var(--purple)','任务',animTasks.length,'合计')+statCard('var(--green)','完成',dC,'≥95%')+statCard('var(--yellow)','推进',fC,'1~94%')+statCard('var(--blue)','人天预期',tE.toFixed(1)+'d','总计')+statCard('var(--purple)','平均进度',avgP+'%','')+'</div>'}

// 内联编辑函数

function exportExcel(){if(typeof XLSX==='undefined'){toast('xlsx 库未加载');return}var aRows=[['任务','层级','人天预期','GAC','进度%','阶段','跟进人','策划','里程碑','截止日期','易协作#']];animTasks.forEach(function(a){aRows.push([a.gun,TL[a.tier]||a.tier,a.estDays,a.gacScore,calcAP(a),animStage(a),a.follower||'',a.planner||'',a.milestone||'',a.deadline||'',a.gcpId||''])});var ws=XLSX.utils.aoa_to_sheet(aRows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'动画管线');XLSX.writeFile(wb,'动画管线管理.xlsx')}

function importExcel(input){if(!input.files||!input.files[0])return;if(typeof XLSX==='undefined'){toast('xlsx 库未加载');return}var f=input.files[0];var reader=new FileReader();reader.onload=function(e){try{var wb=XLSX.read(e.target.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var data=XLSX.utils.sheet_to_json(ws,{header:1});if(data.length<2){toast('数据为空');return}var headers=data[0];for(var i=1;i<data.length;i++){var row=data[i];if(!row[0])continue;var gun=String(row[0]).trim();var found=animTasks.find(function(t){return t.gun===gun});if(!found){var mx=animTasks.reduce(function(m,a){return Math.max(m,a.id)},0);found={id:mx+1,gun:gun,tier:'iter',estDays:10,spentDays:0,gacScore:0,dynamicDone:false,follower:'',planner:'',milestone:'',deadline:'',gcpId:null,tasks:[]};if(!found.L1&&found.tier==='t1'||found.tier==='iter'){found.L1=0;found.L2=0;found.L3=0}animTasks.push(found)}if(row[1]){var tierKey=Object.keys(TL).find(function(k){return TL[k]===row[1]});if(tierKey)found.tier=tierKey}if(row[2]!=null)found.estDays=parseFloat(row[2])||0;if(row[3]!=null)found.gacScore=parseFloat(row[3])||0;if(row[5]){/* stage info */}if(row[6])found.follower=row[6];if(row[7])found.planner=row[7];if(row[8])found.milestone=row[8];if(row[9])found.deadline=row[9];if(row[10]!=null)found.gcpId=row[10]}saveAll();renderAll();toast('导入完成')}catch(err){toast('导入失败：'+err.message)}finally{input.value=''}};reader.readAsArrayBuffer(f)}

// ====== 直接同步到 GitHub ======
var GITHUB_TOKEN = '';
var GITHUB_REPO = 'skyniuniu/anim-pipeline';
var GITHUB_BRANCH = 'main';
var GITHUB_FILE = 'anim-pipeline.html';

function syncToGitHub(){
  var token = prompt('请输入 GitHub Token：', GITHUB_TOKEN);
  if(!token) { toast('已取消'); return; }
  GITHUB_TOKEN = token;
  
  var btn = event ? event.target : document.querySelector('[onclick="syncToGitHub()"]');
  if(btn) { btn.textContent = '⏳ 同步中...'; btn.disabled = true; }
  
  // 先从 GitHub 获取当前文件信息（拿到 sha）
  var apiUrl = 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + GITHUB_FILE + '?ref=' + GITHUB_BRANCH;
  
  fetch(apiUrl, {
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.message && data.message !== 'Not Found') { throw new Error(data.message); }
    var sha = data.sha || null;
    
    // 构造新的 HTML，用当前数据替换初始化数据
    var json = JSON.stringify(animTasks);
    // 获取当前页面的完整 HTML 结构，替换 animTasks 初始化数据
    var fullHtml = document.documentElement.outerHTML;
    // 用正则替换 var animTasks=[...] 为当前数据
    fullHtml = fullHtml.replace(/var animTasks=\[.*?\];(?:\s*var TL=)/, 'var animTasks=' + json + ';\nvar TL=');
    
    var content = btoa(unescape(encodeURIComponent(fullHtml)));
    
    var body = {
      message: 'sync data ' + new Date().toLocaleString('zh-CN'),
      content: content,
      branch: GITHUB_BRANCH
    };
    if(sha) body.sha = sha;
    
    return fetch(apiUrl, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }).then(function(r){ return r.json(); }).then(function(res){
    if(res.message && res.message !== 'Not Found') { throw new Error(res.message); }
    toast('✅ 已同步到 GitHub！刷新 GitHub Pages 即可生效');
    if(btn) { btn.textContent = '📤 同步到 GitHub'; btn.disabled = false; }
  }).catch(function(err){
    toast('❌ 同步失败：' + err.message);
    if(btn) { btn.textContent = '📤 同步到 GitHub'; btn.disabled = false; }
  });
}
